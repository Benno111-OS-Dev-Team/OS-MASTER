name: CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:

  Build:
    name: Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up release build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            dosfstools \
            fdisk \
            mtools \
            qemu-system-x86 \
            qemu-system-arm \
            qemu-system-aarch64 \
            qemu-efi-aarch64 \
            qemu-utils \
            xorriso \
            make \
            lld \
            llvm \
            nasm
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full

      - name: Build x86_64 OS installer with staged system image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          export BUILD_COMPILE_TIME="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          make -f Makefile.multiarch ARCH=x86_64 installer-image

      - name: Verify release files
        run: |
          set -euxo pipefail
          ls -lh \
            image/os8-x86_64-installer.iso \
            image/os8-x86_64-installer.iso.xz \
            image/os8-x86_64-installer.iso.7z \
            image/os8-x86_64-installer.img \
            image/os8-x86_64-system.img \
            image/os8-x86_64-dos-env.img \
            build/x86_64/system-image.zip \
            build/x86_64/boot-files.zip
          file image/os8-x86_64-installer.iso
          file image/os8-x86_64-installer.iso.xz
          file image/os8-x86_64-installer.iso.7z
          file image/os8-x86_64-installer.img
          file image/os8-x86_64-system.img
          file image/os8-x86_64-dos-env.img
          test -d build/x86_64/system-image
          test -f build/x86_64/system-image/boot/main.sys
          test -f build/x86_64/system-image/boot/screen/logo.svg
          test -f build/x86_64/system-image/boot/screen/bar.svg
          test -f build/x86_64/system-image/boot/screen/progress.png

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          # os CI Draft

          Automatic draft release generated from CI.

          ## Build Status

          - ARM64 ISO: skipped for now
          - x86_64 staged system image: success
          - x86_64 installer ISO: success
          - x86_64 DOS installer image: success

          ## Bootable Media

          - \`os8-x86_64-installer.iso\`
          - \`os8-x86_64-installer.iso.xz\`
          - \`os8-x86_64-installer.iso.7z\`
          - \`os8-x86_64-installer.img\`
          - \`os8-x86_64-system.img\`
          - \`os8-x86_64-dos-env.img\`
          - \`system-image.zip\`
          - \`boot-files.zip\`

          ## Branch
          - \`${{ github.ref_name }}\`

          ## Commit
          - \`${{ github.sha }}\`
          EOF

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: os-ci-draft
          target_commitish: ${{ github.sha }}
          name: os CI Draft
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            image/os8-x86_64-installer.iso
            image/os8-x86_64-installer.iso.xz
            image/os8-x86_64-installer.iso.7z
            image/os8-x86_64-installer.img
            image/os8-x86_64-system.img
            image/os8-x86_64-dos-env.img
            build/x86_64/system-image.zip
            build/x86_64/boot-files.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
