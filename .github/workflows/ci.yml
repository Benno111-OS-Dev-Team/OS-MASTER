name: FreeBSD Release Staging

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  stage-freebsd:
    name: Stage Official FreeBSD Media
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRODUCT_NAME: os-master-freebsd
      FREEBSD_RELEASE: 14.4-RELEASE
      FREEBSD_ARCH: amd64
      FREEBSD_IMAGE_BASENAME: disc1.iso

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install staging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            xz-utils \
            file \
            make

      - name: Stage official FreeBSD image
        run: |
          set -euxo pipefail
          make image

      - name: Verify staged outputs
        run: |
          set -euxo pipefail
          OUTPUT_PREFIX="image/${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}"
          ls -lh "${OUTPUT_PREFIX}" "${OUTPUT_PREFIX}.xz" "${OUTPUT_PREFIX}.txt"
          file "${OUTPUT_PREFIX}"
          file "${OUTPUT_PREFIX}.xz"

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          # OS-MASTER FreeBSD Draft

          This draft republishes an official FreeBSD release image staged by CI.

          ## Base

          - FreeBSD release: \`${FREEBSD_RELEASE}\`
          - Architecture: \`${FREEBSD_ARCH}\`
          - Image: \`${FREEBSD_IMAGE_BASENAME}\`

          ## Files

          - \`${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}\`
          - \`${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.xz\`
          - \`${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.txt\`

          ## Branch
          - \`${{ github.ref_name }}\`

          ## Commit
          - \`${{ github.sha }}\`
          EOF

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: os-master-freebsd-draft
          target_commitish: ${{ github.sha }}
          name: OS-MASTER FreeBSD Draft
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            image/os-master-freebsd-14.4-RELEASE-amd64-disc1.iso
            image/os-master-freebsd-14.4-RELEASE-amd64-disc1.iso.xz
            image/os-master-freebsd-14.4-RELEASE-amd64-disc1.iso.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
