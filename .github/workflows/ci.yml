name: FreeBSD X11 Release Staging

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  stage-freebsd:
    name: Stage FreeBSD X11 Installer Media
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRODUCT_NAME: os-master-freebsd
      FREEBSD_RELEASE: 14.4-RELEASE
      FREEBSD_ARCH: amd64
      FREEBSD_IMAGE_BASENAME: dvd1.iso

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install staging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            xz-utils \
            file \
            make \
            python3 \
            xorriso

      - name: Stage customized FreeBSD image
        run: |
          set -euxo pipefail
          make image

      - name: Verify staged outputs
        run: |
          set -euxo pipefail
          OUTPUT_PREFIX="image/${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}"
          ls -lh "${OUTPUT_PREFIX}" "${OUTPUT_PREFIX}.xz" "${OUTPUT_PREFIX}.txt"
          file "${OUTPUT_PREFIX}"
          file "${OUTPUT_PREFIX}.xz"

      - name: Prepare release-sized assets
        run: |
          set -euxo pipefail
          OUTPUT_PREFIX="image/${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}"
          PART_PREFIX="${OUTPUT_PREFIX}.xz.part-"
          split -b 1900m -d -a 3 "${OUTPUT_PREFIX}.xz" "${PART_PREFIX}"
          ls -lh "${OUTPUT_PREFIX}.xz".part-*

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          # OS-MASTER FreeBSD X11 Draft

          This draft stages a customized FreeBSD installer image with X11 hooks for the installer and the installed system.

          ## Base

          - FreeBSD release: \`${FREEBSD_RELEASE}\`
          - Architecture: \`${FREEBSD_ARCH}\`
          - Image: \`${FREEBSD_IMAGE_BASENAME}\`
          - Customization: `xorg` preinstall in installer and target system

          ## Files

          - \`${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.xz.part-000\`
          - \`${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.xz.part-001\`
          - additional \`.xz.part-*\` files when required
          - \`${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.txt\`

          ## Notes

          - The raw \`.iso\` is built during CI validation.
          - GitHub Releases cannot store assets larger than 2 GiB, so the compressed DVD image is split into \`.xz.part-*\` chunks for publishing.
          - Reassemble the compressed image with: \`cat ${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.xz.part-* > ${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.xz\`
          - Then expand it with: \`xz -d ${PRODUCT_NAME}-${FREEBSD_RELEASE}-${FREEBSD_ARCH}-${FREEBSD_IMAGE_BASENAME}.xz\`

          ## Branch
          - \`${{ github.ref_name }}\`

          ## Commit
          - \`${{ github.sha }}\`
          EOF

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: os-master-freebsd-draft
          target_commitish: ${{ github.sha }}
          name: OS-MASTER FreeBSD X11 Draft
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            image/os-master-freebsd-14.4-RELEASE-amd64-dvd1.iso.xz.part-*
            image/os-master-freebsd-14.4-RELEASE-amd64-dvd1.iso.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
