name: CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:

  Build:
    name: Numbered multi-arch release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_BRANCH: ${{ github.ref_name }}
      BUILD_STRING: ${{ github.run_number }} OS8 CI BUILD

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch external XNU source
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git External/xnu
          chmod -R a-w External/xnu

      - name: Set up release build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            dosfstools \
            fdisk \
            mtools \
            qemu-system-x86 \
            qemu-system-arm \
            qemu-system-aarch64 \
            qemu-efi-aarch64 \
            qemu-utils \
            xz-utils \
            xorriso \
            make \
            lld \
            llvm \
            nasm
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full

      - name: Check source quality gates
        run: |
          set -euxo pipefail
          make check-source-complete
          make check-xnu-boot-abi
          XNU_SOURCE_VALIDATION_ONLY=1 make ARCH=x86_64 kernel
          grep -q '^provider=xnu$' build/x86_64/kernel/xnu-provider.manifest
          grep -q '^mode=source-validation$' build/x86_64/kernel/xnu-provider.manifest
          grep -q '^source_origin=https://github.com/apple-oss-distributions/xnu.git$' build/x86_64/kernel/xnu-provider.manifest
          grep -Eq '^source_commit=[0-9a-f]{40}$' build/x86_64/kernel/xnu-provider.manifest
          grep -q '^source_state=clean$' build/x86_64/kernel/xnu-provider.manifest
          grep -q '^artifact=.*/build/x86_64/kernel/xnu-x86_64.kernel$' build/x86_64/kernel/xnu-provider.manifest
          test -z "$(git -C External/xnu status --porcelain=v1 --untracked-files=normal)"
          XNU_SOURCE_VALIDATION_ONLY=1 make ARCH=x86_64 image
          bash scripts/check-xnu-provider-media.sh x86_64 image/xnu-x86_64-provider.tar.gz source-validation
          XNU_SOURCE_VALIDATION_ONLY=1 make ARCH=arm64 image
          bash scripts/check-xnu-provider-media.sh arm64 image/xnu-arm64-provider.tar.gz source-validation
          test -z "$(git -C External/xnu status --porcelain=v1 --untracked-files=normal)"
          make storage-format-stress
          make storage-driver-compile-check

      - name: Compile custom x86_64 UEFI boot chain
        run: |
          set -euxo pipefail
          make -f Makefile.multiarch KERNEL_PROVIDER=os8 ARCH=x86_64 custom-uefi-chain
          llvm-readobj --file-headers build/x86_64/boot/custom-uefi/BOOTX64.EFI
          llvm-readobj --file-headers build/x86_64/boot/custom-uefi/STARTUPX64.EFI

      - name: Build x86_64 release and installer media
        run: |
          set -euxo pipefail
          export BUILD_COMPILE_TIME="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          make -f Makefile.multiarch KERNEL_PROVIDER=os8 ARCH=x86_64 image
          make -f Makefile.multiarch KERNEL_PROVIDER=os8 ARCH=x86_64 installer-image

      - name: Build ARM64 release and installer media
        run: |
          set -euxo pipefail
          export BUILD_COMPILE_TIME="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          make -f Makefile.multiarch KERNEL_PROVIDER=os8 ARCH=arm64 image
          make -f Makefile.multiarch KERNEL_PROVIDER=os8 ARCH=arm64 installer-image

      - name: Verify release files
        run: |
          set -euxo pipefail
          ls -lh image/os8-x86_64.iso*
          ls -lh image/os8-x86_64-installer.iso*
          ls -lh image/os8-x86_64-installer.img
          ls -lh image/os8-arm64.iso*
          ls -lh image/os8-arm64-installer.iso*
          ls -lh image/xnu-x86_64-provider.tar.gz
          ls -lh image/xnu-arm64-provider.tar.gz
          file image/os8-x86_64.iso
          file image/os8-x86_64-installer.iso
          file image/os8-x86_64-installer.img
          file image/os8-arm64.iso
          file image/os8-arm64-installer.iso
          if [ -f image/os8-x86_64.iso.xz ]; then
            file image/os8-x86_64.iso.xz
          fi

      - name: Stage numbered release artifacts
        run: |
          set -euxo pipefail
          mkdir -p release
          build="build-${BUILD_NUMBER}"
          cp image/os8-x86_64.iso "release/os8-${build}-x86_64.iso"
          cp image/os8-x86_64.iso.xz "release/os8-${build}-x86_64.iso.xz"
          cp image/os8-x86_64-installer.iso "release/os8-${build}-x86_64-installer.iso"
          cp image/os8-x86_64-installer.iso.xz "release/os8-${build}-x86_64-installer.iso.xz"
          cp image/os8-x86_64-installer.img "release/os8-${build}-x86_64-installer.img"
          if [ -f image/os8-x86_64-installer.iso.7z ]; then
            cp image/os8-x86_64-installer.iso.7z "release/os8-${build}-x86_64-installer.iso.7z"
          fi
          cp image/os8-arm64.iso "release/os8-${build}-arm64.iso"
          cp image/os8-arm64.iso.xz "release/os8-${build}-arm64.iso.xz"
          cp image/os8-arm64-installer.iso "release/os8-${build}-arm64-installer.iso"
          cp image/os8-arm64-installer.iso.xz "release/os8-${build}-arm64-installer.iso.xz"
          cp image/xnu-x86_64-provider.tar.gz "release/os8-${build}-xnu-x86_64-provider.tar.gz"
          cp image/xnu-arm64-provider.tar.gz "release/os8-${build}-xnu-arm64-provider.tar.gz"
          ls -lh release

      - name: Generate release notes
        run: |
          cat > release_notes.md << EOF
          # OS8 CI Build ${{ github.run_number }}

          Automatic release generated from CI.

          ## Build Number

          - \`${{ github.run_number }}\`

          ## Build Status

          - x86_64 ISO: success
          - x86_64 installer: success
          - ARM64 ISO: success
          - ARM64 installer: success
          - XNU x86_64 provider media: success
          - XNU ARM64 provider media: success

          ## Bootable Media

          - \`os8-build-${{ github.run_number }}-x86_64.iso\`
          - \`os8-build-${{ github.run_number }}-x86_64.iso.xz\`
          - \`os8-build-${{ github.run_number }}-x86_64-installer.iso\`
          - \`os8-build-${{ github.run_number }}-x86_64-installer.iso.xz\`
          - \`os8-build-${{ github.run_number }}-x86_64-installer.img\`
          - \`os8-build-${{ github.run_number }}-arm64.iso\`
          - \`os8-build-${{ github.run_number }}-arm64.iso.xz\`
          - \`os8-build-${{ github.run_number }}-arm64-installer.iso\`
          - \`os8-build-${{ github.run_number }}-arm64-installer.iso.xz\`
          - \`os8-build-${{ github.run_number }}-xnu-x86_64-provider.tar.gz\`
          - \`os8-build-${{ github.run_number }}-xnu-arm64-provider.tar.gz\`

          ## Branch
          - \`${{ github.ref_name }}\`

          ## Commit
          - \`${{ github.sha }}\`
          EOF

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: os8-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OS8 CI Build ${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
