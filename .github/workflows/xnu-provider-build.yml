name: XNU Provider Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: XNU architecture to build
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - arm64
      sdkroot:
        description: SDKROOT passed to the XNU build
        required: true
        default: macosx
      kernel_configs:
        description: KERNEL_CONFIGS passed to the XNU build
        required: true
        default: RELEASE
      kdkroot:
        description: Optional KDKROOT passed to the XNU build
        required: false
        default: ''

jobs:
  xnu-provider:
    name: Build external XNU provider
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      SDKROOT: ${{ inputs.sdkroot }}
      KERNEL_CONFIGS: ${{ inputs.kernel_configs }}
      KDKROOT: ${{ inputs.kdkroot }}

    steps:
      - name: Checkout OS8 integration
        uses: actions/checkout@v4

      - name: Fetch external XNU source
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/apple-oss-distributions/xnu.git External/xnu
          chmod -R a-w External/xnu

      - name: Inspect macOS build host
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version

      - name: Install XNU boot image tools
        run: |
          set -euxo pipefail
          brew install coreutils mtools qemu

      - name: Check XNU build environment
        run: |
          set -euxo pipefail
          make -f Makefile.multiarch \
            KERNEL_PROVIDER=xnu \
            ARCH="${{ inputs.arch }}" \
            check-xnu-build-env

      - name: Build selected XNU provider
        run: |
          set -euxo pipefail
          make -f Makefile.multiarch KERNEL_PROVIDER=xnu ARCH="${{ inputs.arch }}" kernel
          if [ "${{ inputs.arch }}" = "x86_64" ]; then
            make -f Makefile.multiarch KERNEL_PROVIDER=xnu ARCH=x86_64 xnu-uefi-chain
          fi
          make -f Makefile.multiarch KERNEL_PROVIDER=xnu ARCH="${{ inputs.arch }}" xnu-image

      - name: Verify XNU provider output
        run: |
          set -euxo pipefail
          manifest="build/${{ inputs.arch }}/kernel/xnu-provider.manifest"
          archive="image/xnu-${{ inputs.arch }}-provider.tar.gz"
          test -s "$manifest"
          grep -q '^provider=xnu$' "$manifest"
          grep -q '^mode=compiled$' "$manifest"
          grep -q '^source_origin=https://github.com/apple-oss-distributions/xnu.git$' "$manifest"
          grep -Eq '^source_commit=[0-9a-f]{40}$' "$manifest"
          grep -q '^source_state=clean$' "$manifest"
          test -s "build/${{ inputs.arch }}/kernel/xnu-${{ inputs.arch }}.kernel"
          bash scripts/check-xnu-kernel-artifact.sh "${{ inputs.arch }}" "build/${{ inputs.arch }}/kernel/xnu-${{ inputs.arch }}.kernel"
          bash scripts/check-xnu-provider-media.sh "${{ inputs.arch }}" "$archive" compiled
          if [ "${{ inputs.arch }}" = "x86_64" ]; then
            test -s build/x86_64/boot/custom-uefi/STARTUPX64.EFI
            test -s image/xnu-x86_64-uefi.img
            grep -q '^kernel_format=xnu$' build/x86_64/boot/custom-uefi/os8boot.cfg
            tar -tzf "$archive" | grep -q '^./boot/custom-uefi/STARTUPX64.EFI$'
            tar -tzf "$archive" | grep -q '^./image/xnu-x86_64-uefi.img$'
            make -f Makefile.multiarch ARCH=x86_64 check-xnu-compiled-uefi-boot-smoke
          fi
          test -z "$(git -C External/xnu status --porcelain=v1 --untracked-files=normal)"

      - name: Upload XNU provider media
        uses: actions/upload-artifact@v4
        with:
          name: xnu-${{ inputs.arch }}-provider
          path: |
            image/xnu-${{ inputs.arch }}-provider.tar.gz
            build/${{ inputs.arch }}/kernel/xnu-provider.manifest
            build/${{ inputs.arch }}/boot/custom-uefi/STARTUPX64.EFI
            build/${{ inputs.arch }}/boot/custom-uefi/os8boot.cfg
            image/xnu-x86_64-uefi.img
